<div class="sidebar sidebar_left" *ngIf="viewport > 1.8"></div>
<div class="sidebar sidebar_right" *ngIf="viewport > 1.8"> 
  <div class="arrowWrap">
    <div class="arrowUp">
      <i-bs name="caret-up-fill" 
            width="100" height="100"
            (click)="zapchannel('up')">
      </i-bs>
    </div>
    <div class="arrowDown">
      <i-bs name="caret-down-fill" 
            width="100" height="100"
            (click)="zapchannel('down')">
      </i-bs>
    </div>
  </div>
</div>
