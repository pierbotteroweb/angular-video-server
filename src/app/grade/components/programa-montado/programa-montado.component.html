<div class="programaMontado" [style.width.px]="programaMontado.tempoTotalEmSegundos/10" 
[class.programaMontado--selected]="programaMontadoIsSelected">
    <p class="titulo">{{programaMontado.tituloAtracao}}</p>
    <p class="horario">{{programaMontado.horarioDeExibicao}}</p>
    <span>{{programaMontado.tempoTotal}}</span>
</div>
